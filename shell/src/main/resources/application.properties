spring.application.name=janus-shell
spring.main.web-application-type=none

# Keep process alive and show interactive prompt (required in IDE unless terminal is emulated)
spring.shell.interactive.enabled=true
janus.shell.prompt=janus:> 
janus.shell.verbose-thought=true
# Token / prompt-cache summary at end of each conversation run (off by default)
janus.conversation.llm-usage-log=false

# Console + file logging (see logback.xml); DEBUG for com.wish
logging.level.com.wish=DEBUG
logging.level.root=INFO

# Agent
janus.agent.tool-call.max-steps=30
janus.agent.janus.max-steps=30
janus.agent.janus.workspace-root=workspace/janus
janus.agent.janus.skills.dir=.agent/janus/skills

# Janus web_search (builtin tool; default DuckDuckGo, no API key)
janus.web-search.enabled=true
janus.web-search.provider=duckduckgo
janus.web-search.max-results=5
# Optional: janus.web-search.tavily-api-key=tvly-...
# Optional: janus.web-search.brave-api-key=BSA...
janus.agent.da.max-steps=30
janus.agent.da.workspace-root=workspace/da
janus.agent.da.skills.dir=.agent/da/skills
janus.agent.swe.max-steps=30
janus.agent.swe.workspace-root=workspace/swe
janus.agent.swe.skills.dir=.agent/swe/skills
janus.agent.default.skills.dir=.agent/default/skills
janus.agent.tool-call.skills.dir=.agent/tool-call/skills

# Diagnostic incident reports (markdown + JSON per run; session closure marker on clear)
janus.diagnostic.reports-dir=${user.home}/.janus/diagnostic-reports

# SenseNova via OpenAI-compatible API (Spring AI 2.x auto-config)
spring.ai.model.chat=openai
spring.ai.openai.api-key=sk-zxHA4Aee9gkxA8TLyw254pj1GVjeMYSg
spring.ai.openai.base-url=https://token.sensenova.cn/v1
# Spring AI 2.x: use chat.model (chat.options.model is deprecated and may not bind)
spring.ai.openai.chat.model=sensenova-6.7-flash-lite

# MCP (Claude Desktop format: shell/src/main/resources/mcp-servers.json)
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers.json
